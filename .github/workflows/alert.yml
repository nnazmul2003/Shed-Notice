name: SHED Notice Telegram Alert

on:
  schedule:
    # প্রতি ৫-১০ মিনিট পর পর অটোমেটিক রান হবে (GitHub-এর ট্রাফিকের ওপর ভিত্তি করে সময় একটু এদিক সেদিক হতে পারে)
    - cron: '*/5 * * * *'
  workflow_dispatch: # যাতে আপনি নিজে ক্লিক করেও যেকোনো সময় রান করতে পারেন

jobs:
  check-notice:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ফাইল রাইট করার পারমিশন (sent_notices.txt আপডেট রাখার জন্য)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run notice checker
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_notices.txt || true
        git commit -m "Update sent notices list [skip ci]" || true
        git push || true
